<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مخطط العلبة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--bd:#d9d6cc;--ac:#0f6e56;--mu:#6b6a63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ecebe6;--card:#222427;--bd:#3a3d41;--ac:#3fb893;--mu:#9a9990}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ecebe6;--card:#222427;--bd:#3a3d41;--ac:#3fb893;--mu:#9a9990}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:16px}
.w{max-width:760px;margin:auto}
h1{font-size:20px;margin:0 0 12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
input,select{width:100%;box-sizing:border-box;padding:9px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
button{width:100%;margin-top:12px;padding:11px;font-size:16px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
#d{background:#fff;border-radius:8px;overflow:hidden}
#d svg{display:block;width:100%;height:auto;max-height:70vh}
#m{font-size:13px;color:#b3261e;margin-top:6px;min-height:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:right}
th{color:var(--mu);font-weight:500}
.n{font-size:12px;color:var(--mu);margin-top:8px;line-height:1.7}
body.cust .w>.c:not(.c3d){display:none}
</style>
</head>
<body>
<div class="w">
<h1>مخطط العلبة المفرود</h1>
<div class="c">
<div style="margin-bottom:10px"><label>نوع العلبة</label>
<select id="K"><option value="open">علبة مفتوحة (جدران متصلة بالقاعدة)</option><option value="mailer">علبة ملر (الغطاء متصل بالقاعدة)</option><option value="gable">علبة وجبات بمقبض (سقف مائل)</option><option value="bag">كيس كارتوني (شنطة بحبل)</option><option value="med">علبة دواء (غطاء علوي وسفلي بلسان إدخال)</option></select></div>
<div class="g">
<div><label>الطول L (سم)</label><input id="L" type="text" inputmode="decimal" value="10"></div>
<div><label>العرض W (سم)</label><input id="W" type="text" inputmode="decimal" value="6"></div>
<div><label>الارتفاع H (سم)</label><input id="H" type="text" inputmode="decimal" value="4"></div>
<div><label>عرض لسان اللصق (سم) — 0 بدون ألسنة</label><input id="T" type="text" inputmode="decimal" value="1.2"></div>
<div id="hmx"><label>عمق طية الحافة العلوية (سم)</label><input id="HM" type="text" inputmode="decimal" value="3"></div>
<div id="hsx"><label>تباعد ثقوب الحبل (سم)</label><input id="HS" type="text" inputmode="decimal" value="6"></div>
<div id="spx"><label>تقسيم المخطط</label><select id="SP"><option value="0">كامل (قطعة وحدة)</option><option value="1">مقسوم نصفين (قطعتين)</option></select></div>
<div id="arx"><label>ترتيب القطعتين</label><select id="AR"><option value="side">جنب بعض</option><option value="stack">فوق بعض</option></select></div>
<div id="rrx"><label>ارتفاع السقف (سم)</label><input id="RR" type="text" inputmode="decimal" value="3"></div>
<div id="rhx"><label>ارتفاع المقبض (سم)</label><input id="RH" type="text" inputmode="decimal" value="3.5"></div>
<div id="tkx"><label>عمق لسان إدخال الغطاء (سم)</label><input id="TK" type="text" inputmode="decimal" value="2"></div>
<div id="dnx"><label>عمق الألسنة الجانبية (سم)</label><input id="DN" type="text" inputmode="decimal" value="2.4"></div>
<div id="dbx"><label>ارتفاع الجدران</label><select id="DB"><option value="0">عادي</option><option value="1">مزدوج (دبل ارتفاع)</option></select></div>
<div id="db"><label>عمق الغطاء (سم)</label><input id="D" type="text" inputmode="decimal" value="2"></div>
</div>
<div id="m"></div>
<button id="dl">تحميل المخطط SVG (بالمقياس الحقيقي 1:1 سم)</button>
</div>
<div class="c"><div style="font-weight:600;margin-bottom:8px">إضافة لسان</div>
<div class="g"><div style="grid-column:1/3"><label>مكان اللسان</label><select id="XE"></select></div>
<div id="xlw"><label>طول اللسان (سم) — فارغ = كامل الحافة</label><input id="XL" type="text" inputmode="decimal" value=""></div>
<div><label>عمق اللسان (سم)</label><input id="XD" type="text" inputmode="decimal" value="1.5"></div></div>
<button id="XA">إضافة اللسان</button><div id="XList"></div></div>
<div class="c"><div id="d"></div>
<div class="n">الخط المتصل = قص &nbsp;|&nbsp; الخط المتقطع = طي. كل الأرقام بالسنتيمتر.</div></div>
<div class="c c3d"><div style="font-weight:600;margin-bottom:8px">المجسم ثلاثي الأبعاد وتصميمك</div>
<div id="tv" style="height:380px;border-radius:8px;background:var(--bg);touch-action:none;cursor:grab;position:relative;overflow:hidden"></div>
<div class="n">اسحب لتدوير العلبة (وعجلة الماوس للتقريب). المجسم تقريبي للشكل العام ويتغير مع القياسات.</div>
<div style="margin-top:12px"><label>درجة الطي: <b id="FV">100%</b> — اسحب لفتح العلبة (مسطحة) أو إغلاقها (مطوية)</label>
<input type="range" id="FS" min="0" max="100" value="100" style="padding:0;height:34px"><button id="FP" style="margin-top:6px">تشغيل حركة الطي</button></div>
<div class="g" style="margin-top:10px">
<div style="grid-column:1/3"><label>ارفع تصميمك (صورة PNG أو JPG)</label><input id="DF" type="file" accept="image/*"></div>
<div><label>مكان التصميم</label><select id="DM"><option value="1">الواجهة فقط</option><option value="2">الواجهة والخلف</option><option value="3">الجوانب الأربعة</option></select></div>
<div><label>طريقة التوزيع</label><select id="DFT"><option value="cover">ملء الجهة (يقص الزائد)</option><option value="stretch">تمديد على الجهة</option></select></div>
<div><label>لون العلبة</label><input id="DC" type="color" value="#ffffff" style="height:42px;padding:3px"></div>
<div></div>
<button id="DS">حفظ صورة المجسم PNG</button><button id="DX" style="background:var(--mu)">إزالة التصميم</button>
</div>
<div id="cbtns" class="g" style="margin-top:4px"><button id="CP">تنزيل PDF للزبون (مراحل الطي + المخطط + الجدول)</button><button id="CH" style="background:#2b5fb4">تنزيل نسخة تفاعلية للزبون (HTML)</button></div></div>
<div class="c"><table><thead><tr><th>القطعة</th><th>العدد</th><th>القياس (سم)</th></tr></thead><tbody id="tb"></tbody></table>
<div id="tot" style="font-size:22px;font-weight:700;color:#e53935;margin-top:14px;line-height:1.5"></div><div class="n" id="tot2"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const f=x=>String(+(+x).toFixed(2));
let svgText='',tabs=[],edgeSig='';
function delTab(i){tabs.splice(i,1);render();}
const norm=s=>s.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٫،,]/g,'.').replace(/[^0-9.]/g,'');
const num=id=>parseFloat(norm($(id).value))||0;

const RC=(id,par,x1,y1,x2,y2,side,ang,role,st,up)=>({id,par,poly:[[x1,y1],[x2,y1],[x2,y2],[x1,y2]],hinge:side==='T'?[x1,y1,x2,y1]:side==='B'?[x1,y2,x2,y2]:side==='L'?[x1,y1,x1,y2]:[x2,y1,x2,y2],ang,role,st:st||0,up});
const PG=(id,par,poly,hinge,ang,role,st,up)=>({id,par,poly,hinge,ang,role,st:st||0,up});
function openBox(L,W,H,tb,dbl){
 const T=tb>0,c=Math.min(tb*.4,H*.3),Hi=H+(dbl?0.5:0),ox=dbl?Hi:0,oy=dbl?Hi:0;
 const x0=ox,x1=ox+H,x2=x1+L,x3=x2+H,y0=oy,y1=oy+H,y2=y1+W,y3=y2+H,tw=x3+ox,th=y3+oy,S=[];
 const add=(a,d)=>S.push([...a,d]);
 [[x1,y1,x1,y0],[x2,y0,x2,y1],[x2,y2,x2,y3],[x1,y3,x1,y2]].forEach(a=>add(a,0));
 [[x1,y0,x2,y0],[x3,y1,x3,y2],[x2,y3,x1,y3],[x0,y2,x0,y1]].forEach(a=>add(a,dbl));
 [[x1,y1,x2,y1],[x2,y1,x2,y2],[x1,y2,x2,y2],[x1,y1,x1,y2]].forEach(a=>add(a,1));
 [[x2,y1,x3,y1],[x2,y2,x3,y2],[x0,y2,x1,y2],[x0,y1,x1,y1]].forEach(a=>add(a,T));
 if(T){const tab=(p,q,y,d)=>{const y2_=y+d*tb;const pt=[[p,y],[p+c,y2_],[q-c,y2_],[q,y]];for(let i=0;i<3;i++)add([...pt[i],...pt[i+1]],0)};
  tab(x2,x3,y1,-1);tab(x2,x3,y2,1);tab(x0,x1,y2,1);tab(x0,x1,y1,-1);}
 if(dbl){
  [[x1,y0,x1,0],[x1,0,x2,0],[x2,0,x2,y0],[x1,y3,x1,th],[x1,th,x2,th],[x2,th,x2,y3],[x0,y1,0,y1],[0,y1,0,y2],[0,y2,x0,y2],[x3,y1,tw,y1],[tw,y1,tw,y2],[tw,y2,x3,y2]].forEach(a=>add(a,0));
 }
 const mx=(x1+x2)/2,my=(y1+y2)/2;
 const lab=[[mx,my,'القاعدة',f(L)+' × '+f(W),1.1],[mx,y0+H/2,'الجدار الخلفي',f(L)+' × '+f(H),1],[mx,y2+H/2,'الجدار الأمامي',f(L)+' × '+f(H),1],[x0+H/2,my,'جدار أيسر',f(H)+' × '+f(W),.85],[x2+H/2,my,'جدار أيمن',f(H)+' × '+f(W),.85]];
 if(dbl)lab.push([mx,Hi/2*1,'طية داخلية',f(L)+' × '+f(Hi),.8],[mx,y3+Hi/2,'طية داخلية',f(L)+' × '+f(Hi),.8],[Hi/2,my,'طية داخلية',f(Hi)+' × '+f(W),.7],[x3+Hi/2,my,'طية داخلية',f(Hi)+' × '+f(W),.7]);
 const rows=[['القاعدة',1,f(L)+' × '+f(W)],['الجدار الأمامي / الخلفي',2,f(L)+' × '+f(H)],['الجدار الأيمن / الأيسر',2,f(W)+' × '+f(H)]];
 if(dbl)rows.push(['طية داخلية أمامية / خلفية (ارتفاع مزدوج)',2,f(L)+' × '+f(Hi)],['طية داخلية للجانبين (ارتفاع مزدوج)',2,f(W)+' × '+f(Hi)]);
 if(T)rows.push(['ألسنة اللصق (شبه منحرف)',4,'قاعدة '+f(H)+' × بروز '+f(tb)]);
 const bot=[[0,x0,f(Hi)],[x0,x1,f(H)],[x1,x2,f(L)],[x2,x3,f(H)],[x3,tw,f(Hi)]].filter(a=>a[1]-a[0]>0);
 const left=[[0,y0,f(Hi)],[y0,y1,f(H)],[y1,y2,f(W)],[y2,y3,f(H)],[y3,th,f(Hi)]].filter(a=>a[1]-a[0]>0);
 const edges=[{id:'back',name:'الجدار الخلفي (أعلى)',a:[x1,dbl?0:y0],b:[x2,dbl?0:y0],n:[0,-1]},{id:'front',name:'الجدار الأمامي (أسفل)',a:[x1,dbl?th:y3],b:[x2,dbl?th:y3],n:[0,1]},{id:'left',name:'الجدار الأيسر (يسار)',a:[dbl?0:x0,y1],b:[dbl?0:x0,y2],n:[-1,0]},{id:'right',name:'الجدار الأيمن (يمين)',a:[dbl?tw:x3,y1],b:[dbl?tw:x3,y2],n:[1,0]}];
 const FP=[RC('base',null,x1,y1,x2,y2,'T',0,'base',0),RC('back','base',x1,y0,x2,y1,'B',90,'back',0,[0,-1]),RC('front','base',x1,y2,x2,y3,'T',90,'front',0,[0,1]),RC('left','base',x0,y1,x1,y2,'R',90,'left',0,[-1,0]),RC('right','base',x2,y1,x3,y2,'L',90,'right',0,[1,0])];
 if(T){FP.push(PG('tl1','left',[[x0,y1],[x1,y1],[x1-c,y1-tb],[x0+c,y1-tb]],[x0,y1,x1,y1],90,null,1),PG('tl2','left',[[x0,y2],[x1,y2],[x1-c,y2+tb],[x0+c,y2+tb]],[x0,y2,x1,y2],90,null,1),PG('tr1','right',[[x2,y1],[x3,y1],[x3-c,y1-tb],[x2+c,y1-tb]],[x2,y1,x3,y1],90,null,1),PG('tr2','right',[[x2,y2],[x3,y2],[x3-c,y2+tb],[x2+c,y2+tb]],[x2,y2,x3,y2],90,null,1));}
 if(dbl){FP.push(RC('bi','back',x1,0,x2,y0,'B',180,null,1),RC('fi','front',x1,y3,x2,th,'T',180,null,1),RC('li','left',0,y1,x0,y2,'R',180,null,1),RC('ri','right',x3,y1,tw,y2,'L',180,null,1));}
 return {tw,th,S,lab,rows,bot,left,edges,fold:{panels:FP,mode:'floor',boxSize:Math.max(L,W,H)}};
}

function mailer(L,W,H,tb,d,dbl){
 const ex=dbl?0.5:0,Ho=H,Hi=H+ex,T=tb>0,tk=tb,X0=Math.max(dbl?2*H+ex:H,d),c=Math.min(tb*.4,H*.3),ct=Math.min(tk*.5,L*.1);
 const x1=X0,x2=X0+L,yL=tk,yB=tk+W,y0=yB+H,y1=y0+W,yf=y1+H,th=yf,tw=2*X0+L,S=[];
 const add=(a,dd)=>S.push([...a,dd]);
 const D=d>0;
 if(D){[[x1,yL,x1-d,yL],[x1-d,yL,x1-d,yB],[x1-d,yB,x1,yB],[x2,yL,x2+d,yL],[x2+d,yL,x2+d,yB],[x2+d,yB,x2,yB]].forEach(a=>add(a,0));}
 [[x1,y0,x1-Ho,y0],[x1-Ho,y1,x1,y1],[x2,y0,x2+Ho,y0],[x2+Ho,y1,x2,y1],[x1,th,x2,th]].forEach(a=>add(a,0));
 add([x1-Ho,y0,x1-Ho,y1],dbl);add([x2+Ho,y0,x2+Ho,y1],dbl);
 if(dbl){[[x1-Ho,y0,x1-Ho-Hi,y0],[x1-Ho-Hi,y0,x1-Ho-Hi,y1],[x1-Ho-Hi,y1,x1-Ho,y1],[x2+Ho,y0,x2+Ho+Hi,y0],[x2+Ho+Hi,y0,x2+Ho+Hi,y1],[x2+Ho+Hi,y1,x2+Ho,y1]].forEach(a=>add(a,0));}
 add([x1,yL,x2,yL],tk>0);
 [[x1,yB,x2,yB],[x1,y0,x2,y0],[x1,y1,x2,y1],[x1,y0,x1,y1],[x2,y0,x2,y1]].forEach(a=>add(a,1));
 add([x1,yL,x1,yB],D);add([x2,yL,x2,yB],D);
 [[x1,yB,x1,y0],[x2,yB,x2,y0],[x1,y1,x1,yf],[x2,y1,x2,yf]].forEach(a=>add(a,T));
 if(tk>0){const p=[[x1,yL],[x1+ct,0],[x2-ct,0],[x2,yL]];for(let i=0;i<3;i++)add([...p[i],...p[i+1]],0);}
 if(T){
  const poly=p=>{for(let i=0;i<3;i++)add([...p[i],...p[i+1]],0)};
  poly([[x1,yB],[x1-tb,yB+c],[x1-tb,y0-c],[x1,y0]]);
  poly([[x2,yB],[x2+tb,yB+c],[x2+tb,y0-c],[x2,y0]]);
  poly([[x1,y1],[x1-tb,y1+c],[x1-tb,yf-c],[x1,yf]]);
  poly([[x2,y1],[x2+tb,y1+c],[x2+tb,yf-c],[x2,yf]]);
 }
 const mx=X0+L/2;
 const lab=[[mx,yL+W/2,'الغطاء',f(L)+' × '+f(W),1.1],[mx,yB+H/2,'الجدار الخلفي',f(L)+' × '+f(H),1],[mx,y0+W/2,'القاعدة',f(L)+' × '+f(W),1.1],[mx,y1+H/2,'الجدار الأمامي',f(L)+' × '+f(H),1],
  [x1-Ho/2,y0+W/2,'جدار أيسر',f(H)+' × '+f(W),.85],[x2+Ho/2,y0+W/2,'جدار أيمن',f(H)+' × '+f(W),.85]];
 if(D){lab.push([x1-d/2,yL+W/2,'جانب الغطاء',f(d)+' × '+f(W),.7],[x2+d/2,yL+W/2,'جانب الغطاء',f(d)+' × '+f(W),.7]);}
 if(tk>0)lab.push([mx,tk/2+0.05,'لسان إدخال',f(L)+' × '+f(tk),.6]);
 if(dbl)lab.push([x1-Ho-Hi/2,y0+W/2,'طية داخلية',f(Hi)+' × '+f(W),.7],[x2+Ho+Hi/2,y0+W/2,'طية داخلية',f(Hi)+' × '+f(W),.7]);
 const rows=[['القاعدة',1,f(L)+' × '+f(W)],['الغطاء (متصل بالجدار الخلفي)',1,f(L)+' × '+f(W)],['الجدار الخلفي (يربط القاعدة بالغطاء)',1,f(L)+' × '+f(H)],['الجدار الأمامي',1,f(L)+' × '+f(H)],['الجدار الأيمن / الأيسر',2,f(H)+' × '+f(W)]];
 if(D)rows.push(['جانبا الغطاء',2,f(d)+' × '+f(W)]);
 if(tk>0)rows.push(['لسان إدخال الغطاء',1,f(L)+' × '+f(tk)]);
 if(dbl)rows.push(['طية داخلية للجانبين (ارتفاع مزدوج)',2,f(Hi)+' × '+f(W)]);
 if(T)rows.push(['ألسنة اللصق (شبه منحرف)',4,'قاعدة '+f(H)+' × بروز '+f(tb)]);
 const left=[[0,yL,f(tk)],[yL,yB,f(W)],[yB,y0,f(H)],[y0,y1,f(W)],[y1,yf,f(H)]].filter(a=>a[1]-a[0]>0);
 const xl=dbl?x1-Ho-Hi:x1-Ho,xr=dbl?x2+Ho+Hi:x2+Ho;
 const edges=[{id:'front',name:'الجدار الأمامي (أسفل)',a:[x1,th],b:[x2,th],n:[0,1]},{id:'left',name:'الجدار الأيسر (يسار)',a:[xl,y0],b:[xl,y1],n:[-1,0]},{id:'right',name:'الجدار الأيمن (يمين)',a:[xr,y0],b:[xr,y1],n:[1,0]},{id:'lidl',name:'جانب الغطاء الأيسر',a:[x1-d,yL],b:[x1-d,yB],n:[-1,0]},{id:'lidr',name:'جانب الغطاء الأيمن',a:[x2+d,yL],b:[x2+d,yB],n:[1,0]},{id:'lidt',name:'الغطاء (أعلى)',a:tk>0?[x1+ct,0]:[x1,yL],b:tk>0?[x2-ct,0]:[x2,yL],n:[0,-1]}];
 const FP=[RC('base',null,x1,y0,x2,y1,'T',0,'base',0),RC('back','base',x1,yB,x2,y0,'B',90,'back',0,[0,-1]),RC('lid','back',x1,yL,x2,yB,'B',90,'lid',2),RC('front','base',x1,y1,x2,yf,'T',90,'front',0,[0,1]),RC('left','base',x1-Ho,y0,x1,y1,'R',90,'left',0,[-1,0]),RC('right','base',x2,y0,x2+Ho,y1,'L',90,'right',0,[1,0])];
 if(tk>0)FP.push(PG('tuck','lid',[[x1,yL],[x2,yL],[x2-ct,0],[x1+ct,0]],[x1,yL,x2,yL],90,null,3));
 if(dbl)FP.push(RC('li','left',x1-Ho-Hi,y0,x1-Ho,y1,'R',180,null,1),RC('ri','right',x2+Ho,y0,x2+Ho+Hi,y1,'L',180,null,1));

function buildFold(F,col,mode,fit){
 const g=T3.grp,TH=THREE;
 const pts=F.panels.flatMap(p=>p.poly);
 const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);
 const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
 const cx=(minx+maxx)/2,cy=(miny+maxy)/2,netMax=Math.max(maxx-minx,maxy-miny);
 const orient=new TH.Group();g.add(orient);
 const byId={};
 const nSt=Math.max(...F.panels.map(p=>p.st||0))+1;
 const dMode=({1:['front'],2:['front','back'],3:['front','back','left','right']})[mode]||[];
 F.panels.forEach(p=>{
  byId[p.id]=p;
  const [hx,hy,qx,qy]=p.hinge;
  p.pivot=new TH.Object3D();
  const loc=q=>new TH.Vector2(q[0]-hx,hy-q[1]);
  const sh=new TH.Shape(p.poly.map(loc));
  (p.holes||[]).forEach(r=>sh.holes.push(new TH.Path(r.map(loc))));
  const geo=new TH.ShapeGeometry(sh);
  const useD=!!(designImg&&p.role&&dMode.includes(p.role)&&p.up);
  p.pivot.add(new TH.Mesh(geo,new TH.MeshStandardMaterial({color:col.clone().multiplyScalar(.93),roughness:.7,side:useD?TH.FrontSide:TH.DoubleSide})));
  if(useD){
   const pos=geo.attributes.position,uv=new Float32Array(pos.count*2);
   const ux=p.up[0],uy=p.up[1],Rx=uy,Ry=-ux;
   const us=p.poly.map(q=>q[0]*Rx+q[1]*Ry),vs=p.poly.map(q=>q[0]*ux+q[1]*uy);
   const u0=Math.min(...us),u1=Math.max(...us),v0=Math.min(...vs),v1=Math.max(...vs);
   for(let i=0;i<pos.count;i++){const nx=hx+pos.getX(i),ny=hy-pos.getY(i);uv[2*i]=(nx*Rx+ny*Ry-u0)/(u1-u0);uv[2*i+1]=(nx*ux+ny*uy-v0)/(v1-v0);}
   const g2=geo.clone();g2.setAttribute('uv',new TH.BufferAttribute(uv,2));
   const t=new TH.Texture(designImg);t.needsUpdate=true;t.encoding=TH.sRGBEncoding;t.anisotropy=4;
   if(fit==='cover'){const ia=designImg.width/designImg.height,fa=(u1-u0)/(v1-v0);
    if(ia>fa){t.repeat.x=fa/ia;t.offset.x=(1-t.repeat.x)/2;}else{t.repeat.y=ia/fa;t.offset.y=(1-t.repeat.y)/2;}}
   p.pivot.add(new TH.Mesh(g2,new TH.MeshStandardMaterial({map:t,roughness:.6,side:TH.BackSide})));
  }
  if(p.rope){const r=p.rope,tube=Math.max(.12,Math.min(.25,r.rad*.08));
   const rp=new TH.Mesh(new TH.TorusGeometry(r.rad,tube,8,32,Math.PI),new TH.MeshStandardMaterial({color:0xf0f0f0,roughness:.9}));
   rp.position.set(r.cx-hx,hy-r.cy,-0.08);p.pivot.add(rp);}
  if(!p.par){p.pivot.position.set(hx-cx,cy-hy,0);orient.add(p.pivot);}
  else{
   const pp=byId[p.par],phx=pp.hinge[0],phy=pp.hinge[1];
   p.pivot.position.set(hx-phx,phy-hy,0);pp.pivot.add(p.pivot);
   const ax=qx-hx,ay=-(qy-hy),al=Math.hypot(ax,ay);
   p.axis=new TH.Vector3(ax/al,ay/al,0);
   const c=p.poly.reduce((a,q)=>[a[0]+q[0]/p.poly.length,a[1]+q[1]/p.poly.length],[0,0]);
   const rx=c[0]-hx,ry=-(c[1]-hy);
   p.sgn=Math.sign(p.axis.x*ry-p.axis.y*rx)||1;
  }
  p.s0=nSt>1?p.st*0.6/(nSt-1):0;p.s1=nSt>1?p.s0+0.4:1;
 });
 const qF=new TH.Quaternion().setFromEuler(new TH.Euler(-Math.PI/2,0,0)),qS=new TH.Quaternion().setFromEuler(new TH.Euler(0,Math.PI,0));
 T3.cy=0;
 T3.setT=t=>{
  F.panels.forEach(p=>{if(!p.par)return;const k=Math.max(0,Math.min(1,(t-p.s0)/(p.s1-p.s0))),e=k*k*(3-2*k);p.pivot.quaternion.setFromAxisAngle(p.axis,p.sgn*p.ang*Math.PI/180*e);});
  const te=t*t*(3-2*t);
  orient.quaternion.copy(qF);if(F.mode==='stand')orient.quaternion.slerp(qS,te);
  T3.el_=1.15+(0.3-1.15)*te;
  T3.dist=netMax*1.9*(1-te)+F.boxSize*3.2*te;
  T3.draw();
 };
 T3.fit(Math.max(netMax,F.boxSize*1.5));
 g.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
 T3.resize();
 T3.setT(+$('FS').value/100);
}

function update3d(K,L,W,H,o){

 const mk=(fw,fh,use)=>{
  const m=new THREE.MeshStandardMaterial({color:col,roughness:.65,side:THREE.DoubleSide});
  if(use&&designImg){
   const t=new THREE.Texture(designImg);t.needsUpdate=true;t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
   if(fit==='cover'){const ia=designImg.width/designImg.height,fa=fw/fh;
    if(ia>fa){t.repeat.x=fa/ia;t.offset.x=(1-t.repeat.x)/2;}else{t.repeat.y=ia/fa;t.offset.y=(1-t.repeat.y)/2;}}
   m.map=t;m.color=new THREE.Color(0xffffff);
  }
  return m;
 };
 T3.setT=null;T3.el_=0.35;T3.rx=0;
 if(o.fold){buildFold(o.fold,col,mode,fit);return;}
 const open=(K==='bag'||K==='open');
 const mats=[mk(W,H,mode>=3),mk(W,H,mode>=3),mk(L,W,false),mk(L,W,false),mk(L,H,mode>=1),mk(L,H,mode>=2)];
 if(open)mats[2].visible=false;
 g.add(new THREE.Mesh(new THREE.BoxGeometry(L,H,W),mats));
 let topY=H/2,extra=0;
 const plain=()=>new THREE.MeshStandardMaterial({color:col,roughness:.65,side:THREE.DoubleSide});
 if(K==='bag'){
  const hs=Math.max(1,Math.min(o.hs>0?o.hs:L*.4,L-1)),rad=hs/2,tube=Math.max(.12,Math.min(.25,L*.01));
  const rope=new THREE.MeshStandardMaterial({color:0xf0f0f0,roughness:.9});
  [W/2+.05,-W/2-.05].forEach(z=>{const t=new THREE.Mesh(new THREE.TorusGeometry(rad,tube,8,32,Math.PI),rope);t.position.set(0,H/2-(o.hm>0?o.hm/2:1),z);g.add(t);});
  extra=rad*0.6;
 }
 if(K==='gable'){
  const rr=Math.max(0,o.rr||0),hh=Math.max(0,o.hh||0);
  if(rr>0){
   const A=[-L/2,topY,W/2],B=[L/2,topY,W/2],C=[L/2,topY+rr,0],D=[-L/2,topY+rr,0],E=[L/2,topY,-W/2],F=[-L/2,topY,-W/2];
   const tri=[A,B,C,A,C,D,F,E,C,F,C,D,A,D,F,B,E,C];
   const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(tri.flat(),3));geo.computeVertexNormals();
   g.add(new THREE.Mesh(geo,plain()));
  }
  if(hh>0){
   const sh=new THREE.Shape();sh.moveTo(-L/2,0);sh.lineTo(L/2,0);sh.lineTo(L/2,hh);sh.lineTo(-L/2,hh);sh.lineTo(-L/2,0);
   const cw=Math.min(L*.4,L-2),chh=hh*.45,cr=Math.min(chh*.3,cw*.1),cy=hh/2,a=-cw/2,b=cw/2,t=cy-chh/2,u=cy+chh/2;
   if(cw>0&&chh>0){const ho=new THREE.Path();ho.moveTo(a+cr,t);ho.lineTo(b-cr,t);ho.lineTo(b,t+cr);ho.lineTo(b,u-cr);ho.lineTo(b-cr,u);ho.lineTo(a+cr,u);ho.lineTo(a,u-cr);ho.lineTo(a,t+cr);ho.lineTo(a+cr,t);sh.holes.push(ho);}
   const hm=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.3,bevelEnabled:false}),plain());
   hm.position.set(0,topY+rr,-.15);g.add(hm);
  }
  extra=rr+hh;
 }
 T3.cy=extra/2;
 const m=Math.max(L,W,H+extra);
 T3.dist=m*2.6;
 T3.fit(m*2);
 g.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});
 T3.resize();

 out+=hd(bx0,bx1,yt,f(tw));
 g.bot.forEach(a=>out+=hd(a[0],a[1],yb,a[2]));
 (g.bot2||[]).forEach(a=>out+=hd(a[0],a[1],yb+s*3,a[2]));
 out+=vd(by0,by1,xr,f(th));
 g.left.forEach(a=>out+=vd(a[0],a[1],xl,a[2]));
 const vb=`${bx0-m} ${by0-m} ${tw+2*m} ${th+2*m}`;
 $('d').innerHTML=`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
 svgText=`<svg xmlns="http://www.w3.org/2000/svg" width="${f(tw+2*m)}cm" height="${f(th+2*m)}cm" viewBox="${vb}"><rect x="${bx0-m}" y="${by0-m}" width="${tw+2*m}" height="${th+2*m}" fill="#fff"/>${out}</svg>`;
 window.__rows=rows2;window.__tw=tw;window.__th=th;
 $('tb').innerHTML=rows2.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td dir="ltr" style="text-align:right">${r[2]}</td></tr>`).join('');
 $('tot').textContent='أبعاد اللوح المطلوب: '+f(tw)+' × '+f(th)+' سم';$('tot2').textContent='الحجم الداخلي للعلبة: '+f(L)+' × '+f(W)+' × '+f(H)+' سم (بدون احتساب سمك المادة).'+(g.note?' — '+g.note:'');
 try{update3d(K,L,W,H,{rr:num('RR'),hh:num('RH'),hs:num('HS'),hm:num('HM'),fold:g.fold});}catch(e){console.error(e)}
}
$('dl').onclick=()=>{
 if(!svgText)return;
 saveFile(($('K').value==='mailer'?'mailer_':'box_')+'net_'+$('L').value+'x'+$('W').value+'x'+$('H').value+'.svg',new Blob([svgText],{type:'image/svg+xml'}));
};
['L','W','H','T','D','TK','DN','RR','RH','HM','HS','XL','XD'].forEach(i=>$(i).addEventListener('input',()=>{const e=$(i),n=norm(e.value);if(e.value!==n)e.value=n;render()}));
$('XA').onclick=()=>{const d=num('XD');if(!(d>0)||!$('XE').value)return;tabs.push({k:$('K').value,id:$('XE').value,len:num('XL'),depth:d});render();};
$('K').addEventListener('change',render);$('DM').addEventListener('change',render);$('DFT').addEventListener('change',render);$('DC').addEventListener('input',render);
$('DF').addEventListener('change',e=>{const f0=e.target.files[0];if(!f0)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{designImg=im;render();};designData=fr.result;im.src=fr.result;};fr.readAsDataURL(f0);});
$('FS').addEventListener('input',()=>{$('FV').textContent=$('FS').value+'%';if(T3.setT)T3.setT(+$('FS').value/100);});
let fAnim=0;$('FP').onclick=()=>{cancelAnimationFrame(fAnim);const a=+$('FS').value,b=a>=50?0:100,t0=performance.now(),dur=3000*Math.abs(b-a)/100+300;const step=n=>{const k=Math.min(1,(n-t0)/dur);$('FS').value=Math.round(a+(b-a)*k);$('FV').textContent=$('FS').value+'%';if(T3.setT)T3.setT(+$('FS').value/100);if(k<1)fAnim=requestAnimationFrame(step);};fAnim=requestAnimationFrame(step);};
$('CP').onclick=exportPDF;$('CH').onclick=exportCust;
$('DX').onclick=()=>{designImg=null;designData=null;$('DF').value='';render();};
$('DS').onclick=()=>{if(!T3.ready)return;T3.draw();T3.r.domElement.toBlob(b=>{if(b)saveFile('mockup.png',b);});};
$('SP').addEventListener('change',render);$('AR').addEventListener('change',render);$('XE').addEventListener('change',render);$('DB').addEventListener('change',render);
if(window.__CUST){const c=window.__CUST;
 ['K','L','W','H','T','D','TK','DN','RR','RH','HM','HS','SP','AR','DB','DM','DFT','DC','FS'].forEach(i=>{if(c[i]!=null&&$(i))$(i).value=c[i];});
 document.body.classList.add('cust');
 document.querySelector('h1').textContent='عرض العلبة ثلاثي الأبعاد';
 ['DF','DM','DFT','DC'].forEach(i=>{$(i).parentElement.style.display='none';});
 ['DX','CP','CH'].forEach(i=>{$(i).style.display='none';});
 $('FV').textContent=$('FS').value+'%';
 if(c.design){designData=c.design;const im=new Image();im.onload=()=>{designImg=im;render();};im.src=c.design;}
}
render();
</script>
